services:
  postgres:
    image: postgres:17
    container_name: projectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectflow
      POSTGRES_PASSWORD: projectflow_password
      POSTGRES_DB: projectflow
    ports:
      - "5432:5432"
    volumes:
      - projectflow_postgres_data:/var/lib/postgresql/data

volumes:
  projectflow_postgres_data: